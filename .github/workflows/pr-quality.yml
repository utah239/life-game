name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  automated-review:
    name: Automated review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check patch whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Review repository structure
        run: python tools/automated_review.py
      - name: Parse dashboard JavaScript
        run: python tools/check_dashboard_javascript.py
      - name: Check CLI
        working-directory: phase1_bank_exp
        run: python game.py --help
      - name: Check regime-aware policy baseline
        run: python tools/check_policy_baseline.py

  tests:
    name: Full test suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run all tests
        working-directory: phase1_bank_exp
        run: python -m unittest discover -v

  automerge:
    name: Auto-merge verified PR
    needs: [automated-review, tests]
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'manual-merge') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Merge the exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          current_head="$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)"
          current_base="$(gh pr view "$PR_URL" --json baseRefOid --jq .baseRefOid)"
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "PR head changed after this workflow started; a newer run will decide."
            exit 0
          fi
          if [[ "$current_base" != "$EXPECTED_BASE" ]]; then
            gh pr update-branch "$PR_URL"
            echo "Base branch was newer; updated the PR and left merge to the next run."
            exit 0
          fi
          if [[ "$(gh pr view "$PR_URL" --json state --jq .state)" != "OPEN" ]] ||
             [[ "$(gh pr view "$PR_URL" --json isDraft --jq .isDraft)" != "false" ]]; then
            echo "PR is closed or draft; no merge attempted."
            exit 0
          fi
          if [[ "$(gh pr view "$PR_URL" --json baseRefName --jq .baseRefName)" != "$DEFAULT_BRANCH" ]] ||
             [[ "$(gh pr view "$PR_URL" --json headRepository --jq .headRepository.nameWithOwner)" != "$EXPECTED_REPOSITORY" ]]; then
            echo "PR repository or base branch changed; no merge attempted."
            exit 0
          fi
          if [[ "$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | any(. == "manual-merge" or . == "do-not-merge")')" == "true" ]]; then
            echo "An automatic-merge stop label is present."
            exit 0
          fi
          if [[ "$(gh pr view "$PR_URL" --json mergeable --jq .mergeable)" != "MERGEABLE" ]]; then
            echo "PR has a merge conflict or mergeability is unknown."
            exit 1
          fi
          gh pr checks "$PR_URL" --required
          gh pr merge "$PR_URL" --squash --delete-branch \
            --match-head-commit "$EXPECTED_HEAD"
